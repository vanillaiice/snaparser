# Copy to snaparser.toml in your working directory, or pass --config PATH.
# CLI flags override these values. Relative paths use the working directory.

# Leave empty to reuse an existing archive, or select an export in browser setup.
# A nonempty value imports this
# export on every `serve` invocation, replacing the selected archive.
# `import` requires a nonempty data path here or on the command line.
data = ""

# One archive database; attachments remain in the original export directory.
db = "snaparser.db"

[server]
# Local access by default. Change explicitly to expose the server to a network.
listen = "127.0.0.1:8080"

# Durations use Go syntax: 500ms, 30s, 2m, etc.
# HTTP timeouts accept 0s to disable them; shutdown_timeout must be positive.
read_header_timeout = "5s"
read_timeout = "15s"
write_timeout = "30s"
idle_timeout = "60s"
shutdown_timeout = "5s"
